<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montagu Stasie | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="mobile.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;300;400&display=swap');
        
        :root {
            --deep-black: #050505;
            --brass: #c4a77d;
            --khaki: #b0a990;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--deep-black);
            overflow: hidden; 
            margin: 0;
        }

        /* Cinematic Background */
        .intro { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            flex-direction: column; 
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('_X1A2940.webp') center/cover no-repeat;
            position: relative;
            padding: 0 20px;
        }

        .typewriter { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.4rem; 
            line-height: 1.4; 
            color: var(--brass); 
            min-height: 120px;
            font-style: italic;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 3rem;
            z-index: 10;
        }

        .enter-btn {
            padding: 1.2rem 4rem;
            border: 1px solid rgba(176, 169, 144, 0.4);
            border-radius: 9999px;
            color: var(--khaki);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            z-index: 10;
            text-decoration: none;
        }

        .enter-btn:hover {
            border-color: var(--brass);
            color: var(--deep-black);
            background-color: var(--brass);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* Film grain texture */
        .intro::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
            opacity: 0.05;
            pointer-events: none;
        }

        @media (max-width: 768px) {
                    /* Make landing page truly full-bleed and centered on small screens.
                       Keep mobile header visible by not overriding the mobile header padding. */
                    body { overflow: visible; }

                    .intro {
                        /* account for mobile header height (64px) so hero fits viewport */
                        min-height: calc(100svh - 64px);
                    padding: 0 !important;
                    margin: 0;
                    width: 100vw;
                    box-sizing: border-box;
                    background-position: center center;
                    background-size: cover;
                }

                .typewriter {
                    font-size: clamp(1.2rem, 6vw, 1.8rem);
                    min-height: 80px;
                    margin: 0 auto 1.5rem auto;
                    padding: 0 12px;
                    text-align: center;
                    width: 100%;
                    max-width: 92%;
                    box-sizing: border-box;
                }

                .enter-btn {
                    padding: 1rem 2.5rem;
                    font-size: 0.75rem;
                    letter-spacing: 0.3em;
                }

                #hero-logo img { height: 38px !important; }
        }
    </style>
    <style>
        body.no-header { padding-top: 0 !important; }

        /* Hide shared header on desktop so landing page is full-screen cinematic */
        @media (min-width: 769px) {
            .fixed-header, nav.fixed-header, #site-header-placeholder { display: none !important; }
            html, body { height: 100%; }
            .intro { min-height: 100vh; height: 100vh; }
        }
    </style>
</head>
<body class="text-white no-header">

    <div id="site-header-placeholder"></div>
    <script src="scripts/header-loader.js" defer></script>

    <section class="intro">
        <div id="typewriter" class="typewriter max-w-4xl"></div>

        <a href="main.html" class="enter-btn">
            Enter the Station
        </a>
    </section>

    <script>
        const messages = [
            "The old bus station whispers your name...",
            "Where journeys once paused... magic now begins.",
            "Come, the fire is waiting for you.",
            "Let the Karoo light your path home."
        ];
        
        let i = 0, txt = '', messageIndex = 0;

        function typeWriter() {
            const currentMessage = messages[messageIndex];
            
            if (i < currentMessage.length) {
                txt += currentMessage.charAt(i);
                document.getElementById("typewriter").innerHTML = txt;
                i++;
                setTimeout(typeWriter, 70);
            } else {
                setTimeout(() => {
                    fadeOutEffect();
                }, 3000);
            }
        }

        function fadeOutEffect() {
            const el = document.getElementById("typewriter");
            el.style.transition = "opacity 1s ease";
            el.style.opacity = "0";
            
            setTimeout(() => {
                i = 0; 
                txt = '';
                messageIndex = (messageIndex + 1) % messages.length;
                el.innerHTML = '';
                el.style.opacity = "1";
                typeWriter();
            }, 1000);
        }

        window.onload = typeWriter;
    </script>

</body>
</html>
