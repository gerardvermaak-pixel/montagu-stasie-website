    <style>
        nav.fixed-header {
            position: fixed;
        }
        .nav-links { display: flex; gap: 25px; align-items: center; position: absolute; left: 50%; transform: translateX(-50%); z-index: 1001; }
        .nav-links a { color: var(--khaki, #b0a990); font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.current { color: var(--text-color, #f8f8f8); }
        .nav-links.active { right: 0; }
        .mobile-toggle { display: none; cursor: pointer; flex-direction: column; gap: 6px; }
        .mobile-toggle span { width: 25px; height: 2px; background: var(--khaki, #b0a990); transition: 0.3s; }

        @media (max-width: 768px) {
            .nav-links { position: fixed; top: 0; right: -100%; width: 70%; height: 100vh; background: rgba(5,5,5,0.98); flex-direction: column; justify-content: center; padding-left: 2rem; border-left: 1px solid rgba(176,169,144,0.1); transition: 0.4s; }
            .nav-links.active { right: 0; }
            .mobile-toggle { display: flex; }
            .nav-links a { font-size: 1rem; padding: 1rem 0; }
        }

        header img { height: 52px; }
        nav.fixed { height: 72px; }
        nav.fixed img { height: 52px; }
        @media (min-width: 768px) { body { padding-top: 72px; } }
        /* Harmonize header */
        @media (min-width: 768px) {
            nav.fixed { height: 64px; }
            nav.fixed img { height: 48px; }
            body { padding-top: 64px; }
        }
    
/* Mobile soft border and safe viewport */
        @media (max-width: 768px) {
            html, body { min-height: 100%; width: 100%; overflow-x: hidden; }
            body { padding: 0 14px 20px; margin: 0; }
            nav#main-nav { left: 0; right: 0; width: calc(100% - 28px); margin: 0 auto; border-left: 1px solid rgba(176,169,144,0.25); border-right: 1px solid rgba(176,169,144,0.25); }
        /* === SLIDESHOW STYLES === */
        .slideshow { position: relative; max-width: 960px; margin: 0 auto; display:flex; align-items:center; justify-content:center; }
        .slideshow img { width: 100%; height: 60vh; max-height: 70vh; object-fit: cover; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.45); color: white; border: none; width: 48px; height: 56px; font-size: 32px; border-radius: 8px; cursor: pointer; z-index: 30; }
        .slide-btn:hover { background: rgba(0,0,0,0.6); }
        .slide-btn.prev { left: 8px; }
        .slide-btn.next { right: 8px; }
        .slide-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display:flex; gap:8px; z-index:40; }
        .slide-dots button { width:10px; height:10px; border-radius:50%; background: rgba(255,255,255,0.35); border: none; cursor:pointer; }
        .slide-dots button.active { background: rgba(196,167,125,0.95); }
        @media (max-width:900px){ .slideshow img { height: 46vh; } .slide-btn { width:40px; height:46px; font-size:26px; } }
            #mobile-menu { border-left: 1px solid rgba(176,169,144,0.25); border-right: 1px solid rgba(176,169,144,0.25); }
            .mobile-layout, .mobile-hero, .content-split, .menu-gallery, .editorial-container, .grid-layout, .product-flex { max-width: 100%; margin: 0 auto; padding: 0; }
        }

        /* === IMPROVED DESKTOP GALLERY (only this section changed) === */
        #gallery.masonry {
            column-width: 320px;
            column-gap: 20px;
            padding: 20px 0;
        }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            <div id="slideshow" class="slideshow">
                <button id="prev" class="slide-btn prev">‹</button>
                <img id="slide-img" src="" alt="Gallery slide" loading="lazy" />
                <button id="next" class="slide-btn next">›</button>
                <div id="slide-dots" class="slide-dots" aria-hidden="false"></div>
            </div>
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .masonry-item:hover {
            transform: scale(1.04);
            box-shadow: 0 25px 50px rgba(159, 18, 57, 0.3);
        }
        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 450ms cubic-bezier(.2,.8,.2,1);
        }
        .masonry-item:hover img {
            transform: scale(1.06);
        }

        /* Hover overlay with title */
        .masonry-item::after {
            content: attr(data-title);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(10,10,10,0.85));
            color: white;
            padding: 30px 20px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
        }
        .masonry-item:hover::after {
            opacity: 1;
        }

        /* Lightbox */
        #lightboxOverlay { 
            position:fixed; 
            inset:0; 
            background:rgba(0,0,0,0.92); 
            display:none; 
            align-items:center; 
            justify-content:center; 
            z-index:3000; 
        }
        #lightboxOverlay img { 
            max-width:92%; 
            max-height:92vh; 
            box-shadow:0 30px 60px rgba(0,0,0,0.7); 
            border-radius:12px; 
        }

        @media (max-width:900px){ 
            /* Single column, full-width masonry on small screens */
            #gallery.masonry{ column-width: 100% !important; column-gap: 0; padding: 0; }
            .masonry-item { margin: 0 0 16px 0; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
            .masonry-item::after { display: none; }
            .masonry-item img { width: 100%; height: auto; display: block; border-radius: 8px; }
            /* Reduce hero spacer on mobile */
            .hero-spacer { min-height: 180px; }
            /* Disable hover transforms on touch devices */
            .masonry-item:hover { transform: none; box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
        }
    </style>

    <script>
    // List of image files from the project (auto-collected)
    const galleryImages = [
        "_X1A3232.jpg","_X1A3234.jpg","_X1A3235.jpg","_X1A3236.jpg","_X1A3199.jpg","_X1A3197-Enhanced-NR.jpg",
        "_X1A3065.jpg","_X1A2948-Enhanced-NR.jpg","_X1A2943.jpg","_X1A2940.jpg","_X1A2920.jpg","_X1A2887-Pano.jpg",
        "_X1A2879.jpg","_X1A2878.jpg","_X1A2874-Pano.jpg","_X1A2829.jpg","_X1A2828.jpg","_X1A2827.jpg","_X1A2825.jpg",
        "_X1A2808.jpg","_X1A2806.jpg","_X1A2784.jpg","_X1A2779.jpg","_X1A2742.jpg","_X1A2740.jpg","_X1A2739.jpg",
        "_X1A2732-Pano.jpg","_X1A2729.jpg","_X1A2727.jpg","_X1A3174-Edit.jpg","_X1A3127.jpg","_X1A2980.jpg","_X1A2962.jpg",
        "_X1A3238-2.jpg","_X1A2874-Pano.webp","_X1A2725.jpg","_X1A2723.jpg","Fbjh6.jpg","NmAOg.jpg"
    ];

    const slideImg = document.getElementById('slide-img');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const dotsEl = document.getElementById('slide-dots');

    let currentIndex = 0;
    let autoplayInterval = null;

    function showSlide(index){
        if(!galleryImages || galleryImages.length===0) return;
        currentIndex = (index + galleryImages.length) % galleryImages.length;
        const src = galleryImages[currentIndex];
        slideImg.src = src;
        slideImg.alt = src.split('/').pop();
        Array.from(dotsEl.children).forEach((d,i)=> d.classList.toggle('active', i===currentIndex));
    }

    function buildDots(){
        dotsEl.innerHTML = '';
        galleryImages.forEach((s,i)=>{
            const btn = document.createElement('button');
            btn.setAttribute('aria-label', 'Slide '+(i+1));
            btn.addEventListener('click', ()=>{ pauseAutoplay(); showSlide(i); });
            dotsEl.appendChild(btn);
        });
    }

    function prev(){ pauseAutoplay(); showSlide(currentIndex-1); }
    function next(){ pauseAutoplay(); showSlide(currentIndex+1); }

    function startAutoplay(){ autoplayInterval = setInterval(()=>{ showSlide(currentIndex+1); }, 5000); }
    function pauseAutoplay(){ if(autoplayInterval){ clearInterval(autoplayInterval); autoplayInterval = null; } }

    // Wire controls
    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    slideImg.addEventListener('click', ()=> openLightbox(slideImg.src));
    document.getElementById('slideshow').addEventListener('mouseenter', pauseAutoplay);
    document.getElementById('slideshow').addEventListener('mouseleave', startAutoplay);

    function openLightbox(src){
        const overlay = document.getElementById('lightboxOverlay');
        const img = document.getElementById('lightboxImg');
        img.src = src; 
        overlay.style.display = 'flex';
    }
    function closeLightbox(){ 
        document.getElementById('lightboxOverlay').style.display = 'none'; 
    }

    document.addEventListener('DOMContentLoaded', function(){
        buildDots();
        showSlide(0);
        startAutoplay();
    });

    <script>
    if (!window._stasieNavInit) {
        window._stasieNavInit = true;
        function toggleMenu() {
            const links = document.getElementById('nav-links');
            if (links) links.classList.toggle('active');
        }

        (function() {
            const currentPage = location.pathname.split('/').pop() || 'landing.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                if (link.getAttribute('href') === currentPage) link.classList.add('current');
            });

            document.querySelectorAll('.nav-dropdown > a').forEach(trigger => {
                trigger.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        const content = this.nextElementSibling;
                        if (!content) return;
                        content.style.display = (content.style.display === 'block') ? 'none' : 'block';
                    }
                });
            });
        })();
    }
    </script>

    <script>
    (function(){
        function initSubmenus(){
            document.querySelectorAll('.nav-dropdown').forEach(function(drop){
                var trigger = drop.querySelector('a');
                var content = drop.querySelector('.dropdown-content');
                if(!trigger || !content) return;
                trigger.addEventListener('click', function(e){
                    if(window.innerWidth <= 768){
                        e.preventDefault();
                        content.style.display = (content.style.display==='block') ? 'none' : 'block';
                    }
                });
            });

            document.addEventListener('click', function(e){
                if(window.innerWidth <= 768){
                    document.querySelectorAll('.nav-dropdown .dropdown-content').forEach(function(c){
                        var parent = c.parentElement;
                        if(!parent.contains(e.target) && c.style.display==='block') c.style.display='none';
                    });
                }
            });
        }
        if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initSubmenus); else initSubmenus();
    })();
    </script>
